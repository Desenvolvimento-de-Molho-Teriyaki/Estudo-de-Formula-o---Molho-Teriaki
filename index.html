const stages=[['Preparo da base','Utilize 80% da água total da formulação. Adicione ao tanque e incorpore o molho de soja sob AGITAÇÃO CONSTANTE, formando a fase principal do molho.',['80% da água','Agitação constante'],0],['Adição do amido','Prepare uma mistura FRIA de amido de milho com 10% da água total. Incorpore à base e aqueça a cerca de 70 °C por aproximadamente cinco minutos, até desenvolver a viscosidade.',['10% da água','≈ 70 °C','≈ 5 minutos'],1],['Hidratação das gomas','Dissolva e hidrate as gomas em 5% da água total para evitar GRUMOS. Adicione ao tanque sob agitação média e mantenha até a estabilização da viscosidade. Utilize goma guar apenas na Formulação 2.',['5% da água','Agitação média'],2],['Ajuste de sabor e conservação','Dissolva glutamato monossódico, sucralose, ácido ascórbico e sorbato de potássio nos 5% finais da água. Incorpore quando a base estiver próxima à TEMPERATURA AMBIENTE.',['5% da água','Base resfriada'],3],['Cor e homogeneização final','Adicione o caramelo IV e mantenha a agitação até a completa HOMOGENEIZAÇÃO. Utilize alta rotação, se disponível, para obter textura lisa. Aguarde a temperatura adequada de envase.',['Cor uniforme','Textura lisa'],-1]];
const checks=['Ingredientes separados e identificados','Rótulos e documentação dos insumos conferidos','Panela ou tanque de mistura disponível','Balança com precisão de pelo menos 0,001 g','Recipientes limpos e amostras identificadas','Receita original preparada para comparação'];
function stageContent(){const s=stages[stageIndex];return `<span class="eyebrow">ETAPA 0${stageIndex+1} DE 05</span><h2>${s[0]}</h2><p>${s[1]}</p><div class="stage-tags">${s[2].map(t=>`<span class="badge">${t}</span>`).join('')}</div><div class="water-label">Distribuição da água no preparo</div><div class="water" aria-label="80% para a base, 10% para o amido, 5% para as gomas, 5% para os demais aditivos">${[80,10,5,5].map((n,i)=>`<span class="${s[3]===i?'selected':''}" style="flex:${n}">${n}%</span>`).join('')}</div><div class="modal-actions">${btn(stageIndex?'Etapa anterior':'Ver formulações',stageIndex?'selectStage('+(stageIndex-1)+')':"nav('formulacoes',true)")}${btn(stageIndex<4?'Próxima etapa '+icon('arrow'):'Ir para os testes '+icon('arrow'),stageIndex<4?'selectStage('+(stageIndex+1)+')':"nav('testes',true)",'primary')}</div>`}
function preparation(){return heading('MODO DE PREPARO','Cinco etapas para preparar o molho.','Siga as quantidades da formulação escolhida e mantenha o mesmo procedimento entre as amostras.')+`<div class="process-grid"><div class="stage-list">${stages.map((s,i)=>`<button class="stage" aria-pressed="${i===stageIndex}" onclick="selectStage(${i})"><span>0${i+1}</span><strong>${s[0]}</strong></button>`).join('')}</div><section class="panel stage-detail" id="stage-detail" aria-live="polite">${stageContent()}</section></div><div class="two-col"><section class="panel"><h2>Antes de começar</h2><div class="progress"><span id="progress" style="width:${checked.size/6*100}%"></span></div><p id="progress-text" aria-live="polite">${checked.size} de 6 itens preparados</p>${checks.map((c,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checked.has(i)?'checked':''}><span>${c}</span></label>`).join('')}</section><section class="panel"><h2>Preparação das amostras</h2><ul class="list"><li>Produza as amostras com as quantidades indicadas em cada formulação.</li><li>Use água para <strong>COMPLETAR 100 mL de produto final</strong>.</li><li>Os percentuais de 80%, 10%, 5% e 5% se referem à água total utilizada no lote.</li><li>Identifique a formulação e mantenha as mesmas condições de preparo e armazenamento na comparação.</li></ul><div class="callout">A quantidade total de água depende da composição. Não corresponde a 100 mL de água adicionada.</div></section></div>`}
function selectStage(i){stageIndex=i;document.querySelectorAll('.stage').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));$('stage-detail').innerHTML=stageContent()}
const testGroups=[['Ambiente dos testes',['Local ventilado, sem odores fortes e com iluminação branca uniforme.','Recipientes iguais, limpos e sem odores ou sabores residuais.','Talheres e recipientes individuais.','Intervalo suficiente entre as provas para não manter o sabor da amostra anterior.']],['Participantes',['Pessoas da produção e, se possível, avaliadores externos.','Boas condições de saúde e ausência de alergias aos ingredientes.','Evitar perfumes fortes; não fumar por pelo menos uma hora antes.','Considerar condições e medicamentos que possam alterar o paladar.']],['Análise sensorial',['Observar aroma, cor, brilho e aparência antes da prova.','Avaliar sabor, odor e textura, comparando com a receita original.','Tomar água entre as provas.','Registrar as opiniões individualmente; discutir somente após responder à avaliação.']]];
function testing(){return heading('ROTEIRO DE TESTES','Avaliar, comparar e ajustar.','Verificar <strong>SABOR, ODOR, APARÊNCIA E TEXTURA</strong> para identificar a formulação mais adequada.')+`<div class="test-grid">${testGroups.map((g,i)=>`<section class="test-card"><div class="step-num">0${i+1}</div><h2>${g[0]}</h2><ul class="list">${g[1].map(t=>'<li>'+t+'</li>').join('')}</ul></section>`).join('')}</div><div class="callout"><strong>COMPARAÇÃO COM A RECEITA ORIGINAL</strong><br>Realize cada teste com pelo menos duas amostras: a receita original e uma ou mais formulações com os aditivos propostos. Prepare no dia ou mantenha por pouco tempo sob as mesmas condições de armazenamento.</div><div class="section-title"><div><h2>Ajustes após a avaliação</h2><p style="margin-top:8px">Selecione o aspecto que precisa ser ajustado.</p></div></div><div class="result-grid">${['Textura','Doçura','Umami'].map((n,i)=>`<button onclick="adjustment(${i})">${n}${icon('arrow')}</button>`).join('')}</div><div class="two-col"><section class="panel"><h2>Uma alteração por rodada</h2><p style="margin-top:14px">O documento propõe ajustes em etapas de <strong>25%</strong>. Identifique qual ingrediente interfere no resultado antes de alterar a formulação.</p></section><section class="panel"><h2>Registro dos resultados</h2><p style="margin-top:14px">Anote a formulação, a quantidade alterada e as percepções dos avaliadores. Compare novamente com a receita original para verificar o efeito da mudança.</p></section></div>`}
function adjustment(i){const blocks=[['Textura · Formulação 2','Avalie a espessura e o efeito da combinação entre amido, goma xantana e goma guar.','A tabela da Formulação 2 indica 8 g de amido. Sobre essa quantidade, 25% correspondem a 2 g: 6 g na redução ou 10 g no aumento.','Os exemplos de ajuste do documento usam 5 g como base, divergindo da tabela. A base do ajuste deve ser confirmada com a EJEQ.'],['Doçura · Formulação 3','Avalie se o caráter doce está abaixo ou acima do desejado.','Uma redução de 25% sobre 40 mg de sucralose resulta em 30 mg. O documento propõe aumentos de 10 mg por rodada.','Qualquer aumento depende da confirmação do limite de uso aplicável à formulação.'],['Umami · Formulação 4','Identifique se a intensidade está associada ao molho de soja ou ao glutamato monossódico.','Uma redução de 25% corresponde a 52,5 mL de molho de soja ou 0,4125 g de glutamato monossódico.','O documento informa 51,25 mL para o molho de soja; o cálculo sobre os 70 mL da formulação resulta em 52,5 mL. Confirmar a correção com a EJEQ.']];const b=blocks[i];modal(b[0],`<div class="info-block"><h3>O QUE AVALIAR</h3><p>${b[1]}</p></div><div class="info-block"><h3>AJUSTE DE 25%</h3><p>${b[2]}</p></div><div class="callout">${b[3]}</div>`)}
function printStudy(){if($('modal').open)$('modal').close();$('print-content').innerHTML=`<h1>Estudo de formulação do molho teriyaki</h1><p>EJEQ · UFPR</p><p>Desenvolver e comparar formulações para alcançar o equilíbrio de textura, doçura e umami.</p>${formulas.map((f,i)=>`<article><h2>Formulação ${i+1} · ${names[i]}</h2><p>${objectives[i]}</p><p>${f.kcal} kcal / 100 mL · ${f.portion} kcal / 15 mL (valores aproximados).</p>${composition(f)}<h3>Alterações sensoriais esperadas</h3><p>${effects[i]}</p></article>`).join('')}<h2 class="print-break">Ingredientes e aditivos</h2>${ingredients.map(x=>`<article><h3>${x[1]} · ${x[0]}</h3><p>${x[2]} ${x[3].replace('Estudo:','Referência do documento:')}</p></article>`).join('')}<h2 class="print-break">Modo de preparo</h2>${stages.map((s,i)=>`<article><h3>${i+1}. ${s[0]}</h3><p>${s[1]}</p></article>`).join('')}<p>Água para completar 100 mL de produto final; os percentuais se referem à água total do lote.</p><h2>Roteiro de testes</h2>${testGroups.map(g=>`<article><h3>${g[0]}</h3><ul>${g[1].map(t=>'<li>'+t+'</li>').join('')}</ul></article>`).join('')}<p>Comparar sempre com a receita original e registrar as alterações. Confirmar com a EJEQ as divergências nos exemplos de ajuste de amido e molho de soja antes de aplicar.</p>`;window.print()}
$('navigation').innerHTML=sections.map(s=>`<button data-page="${s[0]}" onclick="nav('${s[0]}',true)">${icon(s[1])}${s[2]}</button>`).join('');$('menu').innerHTML=icon('menu');$('menu').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',open)};document.addEventListener('click',e=>{if(innerWidth<=760&&!e.target.closest('#sidebar,#menu')){$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}});document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const i=Number(e.target.dataset.check);e.target.checked?checked.add(i):checked.delete(i);$('progress').style.width=checked.size/6*100+'%';$('progress-text').textContent=checked.size+' de 6 itens preparados'}});nav('formulacoes');
</script></body></html>
